<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>C0balt</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .topbar {
            position: fixed; top: 0; left: 0; right: 0; height: 56px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; z-index: 100;
            background: #0f0f13; border-bottom: 1px solid #2a2a35;
        }
        .topbar h1 { font-size: 20px; letter-spacing: 3px; color: #4ea8de; font-weight: 700; }
        .readme-btn {
            background: #4ea8de; color: #0f0f13; border: none;
            padding: 8px 14px; border-radius: 6px; font-size: 13px;
            font-weight: 600; cursor: pointer; text-decoration: none;
        }

        .feed {
            height: 100dvh; overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .feed::-webkit-scrollbar { display: none; }

        .video-slide {
            height: 100dvh; scroll-snap-align: start;
            position: relative; background: #000;
            padding-top: 56px; box-sizing: border-box;
        }
        .video-slide video {
            width: 100%; height: calc(100dvh - 56px);
            object-fit: contain; background: #000; display: block; cursor: pointer;
        }
        @media (orientation: portrait) {
            .video-slide video { object-fit: cover; }
        }

        .video-meta {
            position: absolute; bottom: 20px; left: 16px; right: 80px;
            z-index: 10; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            font-size: 13px; color: #fff; word-break: break-all; pointer-events: none;
        }

        .side-actions {
            position: absolute; right: 12px; bottom: 80px;
            display: flex; flex-direction: column; gap: 20px;
            align-items: center; z-index: 10;
        }
        .action-btn {
            background: rgba(255,255,255,0.15); border: none; color: #fff;
            width: 46px; height: 46px; border-radius: 50%; font-size: 20px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .mute-hint {
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 6px 14px; border-radius: 20px;
            font-size: 12px; color: #fff; z-index: 50; opacity: 0;
            transition: opacity 0.4s; pointer-events: none;
        }
        .mute-hint.show { opacity: 1; }

        #loading-spinner {
            display: none;
            height: 100dvh; scroll-snap-align: start;
            align-items: center; justify-content: center;
            flex-direction: column; gap: 16px;
            color: #888; font-size: 14px;
            background: #0f0f13;
        }
        #loading-spinner.show { display: flex; }
        #loading-spinner .spinner {
            width: 36px; height: 36px;
            border: 3px solid #2a2a35;
            border-top-color: #4ea8de;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .end-card {
            height: 100dvh; scroll-snap-align: start;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 40px; padding-top: 96px;
            background: #0f0f13; box-sizing: border-box;
        }
        .end-card h2 { font-size: 24px; color: #4ea8de; margin-bottom: 12px; }
        .end-card p { font-size: 14px; color: #888; line-height: 1.6; max-width: 400px; }

        .status {
            height: 100dvh; display: flex; align-items: center; justify-content: center;
            color: #888; font-size: 14px; text-align: center;
            padding: 20px; padding-top: 76px; box-sizing: border-box;
        }

        /* 视频错误覆盖层 */
        .video-error {
            position: absolute; inset: 56px 0 0 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 10px; text-align: center; padding: 24px;
            background: rgba(15,15,19,0.92); z-index: 20;
            color: #f87171; font-size: 14px; box-sizing: border-box;
        }
        .video-error .err-title { font-size: 16px; font-weight: 600; color: #f87171; }
        .video-error .err-name { color: #a1a1aa; word-break: break-all; font-size: 12px; }
        .video-error .err-code { color: #71717a; font-size: 12px; }
        .video-error button {
            margin-top: 8px; background: #4ea8de; color: #0f0f13; border: none;
            padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600;
            cursor: pointer;
        }

        /* 列表加载失败提示 */
        .feed-error {
            height: 100dvh; scroll-snap-align: start;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; text-align: center; padding: 40px; padding-top: 96px;
            background: #0f0f13; box-sizing: border-box;
            color: #f87171; font-size: 14px;
        }
        .feed-error button {
            background: #4ea8de; color: #0f0f13; border: none;
            padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="topbar">
        <h1>C0balt</h1>
        <a class="readme-btn" href="https://github.com/aiden12910-12910/C0balt#readme" target="_blank">README</a>
    </div>

    <div class="mute-hint" id="muteHint">Tap to unmute</div>

    <div class="feed" id="feed">
        <div class="status" id="status">Loading videos...</div>
    </div>

    <script>
        // ===== 配置 =====
        const PAGE_SIZE = 20;
        const PREFETCH_THRESHOLD = 10;

        // ===== 状态 =====
        let globalMuted = true;
        let currentPage = 0;
        let hasMore = true;
        let loading = false;
        let totalLoaded = 0;
        let observer = null;
        let spinner = null;
        let totalAvailable = null; // 首次 list 返回的 total
        const slideNodes = [];

        const feed = document.getElementById('feed');

        function showLoading() {
            if (!spinner) return;
            spinner.classList.add('show');
            console.log('[load] spinner ON');
        }
        function hideLoading() {
            if (!spinner) return;
            spinner.classList.remove('show');
            console.log('[load] spinner OFF');
        }

        async function fetchPage(page) {
            const url = `/api/fetch-videos?action=list&page=${page}&size=${PAGE_SIZE}`;
            console.log('[load] fetching page', page, url);
            const res = await fetch(url);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            console.log('[load] page', page, 'returned', data.videos.length, 'hasMore', data.hasMore, 'total', data.total);
            return data;
        }

        // ===== 视频错误码可读化 =====
        function videoErrorText(err) {
            if (!err) return '未知错误';
            const code = err.code;
            if (code === 1) return '加载被中止 (MEDIA_ERR_ABORTED)';
            if (code === 2) return '网络错误 (MEDIA_ERR_NETWORK)';
            if (code === 3) return '解码失败 (MEDIA_ERR_DECODE)';
            if (code === 4) return '格式不支持或文件不存在 (MEDIA_ERR_SRC_NOT_SUPPORTED)';
            return '错误码 ' + code;
        }

        // ===== 在 slide 上显示视频错误覆盖层 =====
        function showVideoError(slide, video, err) {
            if (slide.querySelector('.video-error')) return;
            const box = document.createElement('div');
            box.className = 'video-error';

            const title = document.createElement('div');
            title.className = 'err-title';
            title.textContent = '视频加载失败';

            const name = document.createElement('div');
            name.className = 'err-name';
            name.textContent = video.name;

            const code = document.createElement('div');
            code.className = 'err-code';
            code.textContent = videoErrorText(err);

            const btn = document.createElement('button');
            btn.textContent = '重试';
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                box.remove();
                const vid = slide.querySelector('video');
                if (vid) {
                    vid.load();
                    vid.play().catch(() => {});
                }
            });

            box.appendChild(title);
            box.appendChild(name);
            box.appendChild(code);
            box.appendChild(btn);
            slide.appendChild(box);
            console.warn('[video] error on', video.name, err);
        }

        function renderSlide(video) {
            const slide = document.createElement('div');
            slide.className = 'video-slide';
            slide.dataset.name = video.name;

            const vid = document.createElement('video');
            vid.src = video.url;
            vid.loop = true;
            vid.playsInline = true;
            vid.muted = true;
            vid.preload = 'metadata';
            vid.setAttribute('webkit-playsinline', '');

            // 错误处理：网络、解码、格式不支持
            vid.addEventListener('error', () => {
                showVideoError(slide, video, vid.error);
            });
            // 播放失败（比如浏览器策略）不覆盖 UI，只在 console 提示
            vid.addEventListener('play', () => {
                const box = slide.querySelector('.video-error');
                if (box) box.remove();
            });

            const meta = document.createElement('div');
            meta.className = 'video-meta';
            meta.textContent = video.name;

            const actions = document.createElement('div');
            actions.className = 'side-actions';

            const muteBtn = document.createElement('button');
            muteBtn.className = 'action-btn';
            muteBtn.textContent = globalMuted ? '🔇' : '🔊';
            muteBtn.title = 'Toggle mute';
            muteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                globalMuted = !globalMuted;
                vid.muted = globalMuted;
                muteBtn.textContent = globalMuted ? '🔇' : '🔊';
                showMuteHint(globalMuted ? 'Muted' : 'Unmuted');
            });

            actions.appendChild(muteBtn);
            slide.appendChild(vid);
            slide.appendChild(meta);
            slide.appendChild(actions);

            vid.addEventListener('click', () => {
                if (vid.paused) vid.play().catch(() => {});
                else vid.pause();
            });

            return slide;
        }

        // ===== 空列表 / 列表错误提示 =====
        function showEmptyCard() {
            const end = document.createElement('div');
            end.className = 'end-card';
            end.innerHTML = `
                <h2>暂无视频</h2>
                <p>Hugging Face 仓库里还没有可播放的 MP4。上传后刷新页面即可。</p>
            `;
            feed.appendChild(end);
            console.log('[load] empty card added');
        }

        function showFeedError(message, retryFn) {
            const box = document.createElement('div');
            box.className = 'feed-error';
            const t = document.createElement('div');
            t.textContent = '加载视频列表失败';
            const m = document.createElement('div');
            m.textContent = message || '';
            const btn = document.createElement('button');
            btn.textContent = '重试';
            btn.addEventListener('click', () => {
                box.remove();
                retryFn();
            });
            box.appendChild(t);
            box.appendChild(m);
            box.appendChild(btn);
            feed.appendChild(box);
        }

        // ===== 加载下一页 =====
        async function loadNextPage() {
            if (loading || !hasMore) return;
            loading = true;
            showLoading();

            try {
                const data = await fetchPage(currentPage);

                if (totalAvailable === null && typeof data.total === 'number') {
                    totalAvailable = data.total;
                }

                // 第一页就没有视频 → 显示“暂无视频”，不显示 end card
                if (data.videos.length === 0) {
                    hasMore = false;
                    if (spinner && spinner.parentNode) spinner.parentNode.removeChild(spinner);
                    if (totalAvailable === 0 || totalLoaded === 0) {
                        showEmptyCard();
                    } else {
                        const end = document.createElement('div');
                        end.className = 'end-card';
                        end.innerHTML = `
                            <h2>You're all caught up</h2>
                            <p>No more videos in this feed. Check back later or view the source on GitHub.</p>
                        `;
                        feed.appendChild(end);
                    }
                    console.log('[load] no more videos');
                    hideLoading();
                    return;
                }

                if (spinner && spinner.parentNode) spinner.parentNode.removeChild(spinner);

                const pageVideos = data.videos.slice();
                for (let i = pageVideos.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pageVideos[i], pageVideos[j]] = [pageVideos[j], pageVideos[i]];
                }
                console.log('[load] page', currentPage, 'shuffled order:', pageVideos.map(v => v.name).join(', '));

                pageVideos.forEach(v => {
                    const slide = renderSlide(v);
                    feed.appendChild(slide);
                    slideNodes.push(slide);
                    observer.observe(slide);
                });

                totalLoaded += data.videos.length;
                currentPage += 1;
                hasMore = data.hasMore;

                if (hasMore) {
                    if (spinner) {
                        feed.appendChild(spinner);
                    } else {
                        console.warn('[load] spinner node missing, skip re-append');
                    }
                } else {
                    // 还有内容但到底了 → end card
                    const end = document.createElement('div');
                    end.className = 'end-card';
                    end.innerHTML = `
                        <h2>You're all caught up</h2>
                        <p>No more videos in this feed. Check back later or view the source on GitHub.</p>
                    `;
                    feed.appendChild(end);
                    console.log('[load] end card added');
                }

                console.log('[load] total loaded:', totalLoaded, 'hasMore:', hasMore);
                hideLoading();
            } catch (e) {
                console.error('[load] failed:', e);
                hideLoading();
                if (spinner && spinner.parentNode) spinner.parentNode.removeChild(spinner);
                // 列表请求失败：显示错误 + 重试，不把 loading 状态卡死
                if (totalLoaded === 0) {
                    showFeedError(e.message || String(e), () => {
                        hasMore = true;
                        loading = false;
                        loadNextPage();
                    });
                } else {
                    // 非第一页失败：保留已有内容，spinner 放回去，等下次滚动重试
                    if (spinner && spinner.parentNode !== feed) feed.appendChild(spinner);
                }
            } finally {
                loading = false;
            }
        }

        function setupObserver() {
            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const slide = entry.target;
                    const vid = slide.querySelector('video');
                    if (!vid) return;

                    if (entry.isIntersecting) {
                        document.querySelectorAll('.video-slide video').forEach(v => {
                            if (v !== vid) { v.pause(); v.currentTime = 0; }
                        });
                        vid.muted = globalMuted;
                        vid.play().catch(() => {});

                        const idx = slideNodes.indexOf(slide);
                        const remain = slideNodes.length - idx;
                        console.log('[scroll] idx=', idx, 'remain=', remain, 'hasMore=', hasMore, 'loading=', loading);
                        if (hasMore && !loading && remain <= PREFETCH_THRESHOLD) {
                            console.log('[prefetch] triggered, remain=', remain);
                            loadNextPage();
                        }
                    } else {
                        vid.pause();
                    }
                });
            }, { threshold: 0.6 });
        }

        let hintTimer = null;
        function showMuteHint(text) {
            const hint = document.getElementById('muteHint');
            hint.textContent = text;
            hint.classList.add('show');
            if (hintTimer) clearTimeout(hintTimer);
            hintTimer = setTimeout(() => hint.classList.remove('show'), 1200);
        }

        document.addEventListener('keydown', (e) => {
            const videos = document.querySelectorAll('.video-slide video');
            let current = null, maxVisible = 0;
            videos.forEach(v => {
                const rect = v.getBoundingClientRect();
                const visible = Math.min(rect.bottom, window.innerHeight) - Math.max(rect.top, 0);
                if (visible > maxVisible) { maxVisible = visible; current = v; }
            });
            if (!current) return;
            if (e.key === 'ArrowRight') {
                current.currentTime = Math.min(current.currentTime + 10, current.duration || Infinity);
                e.preventDefault();
            } else if (e.key === 'ArrowLeft') {
                current.currentTime = Math.max(current.currentTime - 10, 0);
                e.preventDefault();
            }
        });

        async function init() {
            feed.innerHTML = '';

            const sp = document.createElement('div');
            sp.id = 'loading-spinner';
            sp.innerHTML = '<div class="spinner"></div><div>Loading...</div>';
            feed.appendChild(sp);
            spinner = sp;

            setupObserver();
            await loadNextPage();
        }

        init();
    </script>
</body>
</html>
