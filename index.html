<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>C0balt · For You</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* 顶部品牌栏 */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
            pointer-events: none;
        }
        .topbar h1 {
            font-size: 20px;
            letter-spacing: 3px;
            color: #4ea8de;
            font-weight: 700;
        }

        /* 滑动容器 */
        .feed {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .feed::-webkit-scrollbar { display: none; }

        /* 单个视频卡片 */
        .video-slide {
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        .video-slide video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* 底部文件名（替代标题） */
        .video-meta {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 80px;
            z-index: 10;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            font-size: 13px;
            color: #fff;
            word-break: break-all;
            pointer-events: none;
        }

        /* 右侧按钮列 */
        .side-actions {
            position: absolute;
            right: 12px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            z-index: 10;
        }
        .action-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
        }
        .action-btn:hover { background: rgba(255,255,255,0.3); }

        /* 静音提示 */
        .mute-hint {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #fff;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }
        .mute-hint.show { opacity: 1; }

        /* Loading / 错误 */
        .status {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="topbar">
        <h1>C0balt</h1>
    </div>

    <div class="mute-hint" id="muteHint">Tap to unmute</div>

    <div class="feed" id="feed">
        <div class="status" id="status">Loading videos...</div>
    </div>

    <script>
        const HF_USER = "aiden12910";
        const HF_REPO = "tiktok-videos";
        const HF_API = `https://huggingface.co/api/models/${HF_USER}/${HF_REPO}`;

        let globalMuted = true; // 默认静音
        let currentPlayingVideo = null;

        async function loadVideos() {
            const feed = document.getElementById("feed");
            const status = document.getElementById("status");

            try {
                const res = await fetch(HF_API);
                if (!res.ok) throw new Error("Failed to fetch repo info");
                const data = await res.json();

                const videos = (data.siblings || [])
                    .map(f => f.rfilename)
                    .filter(name => name.toLowerCase().endsWith(".mp4"));

                if (videos.length === 0) {
                    status.textContent = "No videos yet.";
                    return;
                }

                feed.innerHTML = ""; // 清掉 loading

                videos.forEach((name, index) => {
                    const slide = document.createElement("div");
                    slide.className = "video-slide";
                    slide.dataset.index = index;

                    const video = document.createElement("video");
                    video.src = `https://huggingface.co/${HF_USER}/${HF_REPO}/resolve/main/${encodeURIComponent(name)}`;
                    video.loop = true;
                    video.playsInline = true;
                    video.muted = true;
                    video.preload = "metadata";
                    video.setAttribute("webkit-playsinline", "");

                    const meta = document.createElement("div");
                    meta.className = "video-meta";
                    meta.textContent = name;

                    const actions = document.createElement("div");
                    actions.className = "side-actions";

                    // 静音/取消静音按钮
                    const muteBtn = document.createElement("button");
                    muteBtn.className = "action-btn";
                    muteBtn.textContent = "🔇";
                    muteBtn.title = "Toggle mute";
                    muteBtn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        globalMuted = !globalMuted;
                        video.muted = globalMuted;
                        muteBtn.textContent = globalMuted ? "🔇" : "🔊";
                        showMuteHint(globalMuted ? "Muted" : "Unmuted");
                    });

                    actions.appendChild(muteBtn);

                    slide.appendChild(video);
                    slide.appendChild(meta);
                    slide.appendChild(actions);
                    feed.appendChild(slide);

                    // 点击视频区域：静音/取消静音
                    video.addEventListener("click", () => {
                        globalMuted = !globalMuted;
                        video.muted = globalMuted;
                        muteBtn.textContent = globalMuted ? "🔇" : "🔊";
                        showMuteHint(globalMuted ? "Muted" : "Unmuted");
                    });
                });

                setupIntersectionObserver();

            } catch (e) {
                status.textContent = "Error loading videos: " + e.message;
            }
        }

        function setupIntersectionObserver() {
            const videos = document.querySelectorAll(".video-slide video");

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (entry.isIntersecting) {
                        // 暂停其他所有
                        videos.forEach(v => {
                            if (v !== video) {
                                v.pause();
                                v.currentTime = 0;
                            }
                        });
                        // 播放当前
                        video.muted = globalMuted;
                        video.play().catch(() => {});
                        currentPlayingVideo = video;

                        // 同步静音按钮状态
                        const btn = video.parentElement.querySelector(".action-btn");
                        if (btn) btn.textContent = globalMuted ? "🔇" : "🔊";
                    } else {
                        video.pause();
                    }
                });
            }, {
                threshold: 0.6 // 视频 60% 可见时才播放
            });

            videos.forEach(v => observer.observe(v));
        }

        let hintTimer = null;
        function showMuteHint(text) {
            const hint = document.getElementById("muteHint");
            hint.textContent = text;
            hint.classList.add("show");
            if (hintTimer) clearTimeout(hintTimer);
            hintTimer = setTimeout(() => {
                hint.classList.remove("show");
            }, 1200);
        }

        loadVideos();
    </script>
</body>
</html>
