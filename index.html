<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>C0balt · For You</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
}

.topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 100;
    background: #0f0f13;
    border-bottom: 1px solid #2a2a35;
}
.topbar h1 {
    font-size: 20px;
    letter-spacing: 3px;
    color: #4ea8de;
    font-weight: 700;
}
.readme-btn {
    background: #4ea8de;
    color: #0f0f13;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s;
}
.readme-btn:hover { background: #7ec8e3; }

/* 滑动容器：全屏，内部 slide 占满 100dvh */
.feed {
    height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    -ms-overflow-style: none;
}
.feed::-webkit-scrollbar { display: none; }

/* 每个 slide 占满一屏 */
.video-slide {
    height: 100dvh;
    scroll-snap-align: start;
    position: relative;
    background: #000;
    padding-top: 56px;
    box-sizing: border-box;
}

/* 视频填满 slide 剩余空间，cover 裁剪填满 */
.video-slide video {
    width: 100%;
    height: calc(100dvh - 56px);
    object-fit: cover;
    background: #000;
    display: block;
}

.video-meta {
    position: absolute;
    bottom: 20px;
    left: 16px;
    right: 80px;
    z-index: 10;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    font-size: 13px;
    color: #fff;
    word-break: break-all;
    pointer-events: none;
}

.side-actions {
    position: absolute;
    right: 12px;
    bottom: 80px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
    z-index: 10;
}
.action-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    transition: background 0.2s;
}
.action-btn:hover { background: rgba(255,255,255,0.3); }

.mute-hint {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    color: #fff;
    z-index: 50;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
}
.mute-hint.show { opacity: 1; }

.end-card {
    height: 100dvh;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    background: #0f0f13;
    padding-top: 96px; /* 56px 顶部栏 + 40px 内边距 */
    box-sizing: border-box;
}
.end-card h2 {
    font-size: 24px;
    color: #4ea8de;
    margin-bottom: 12px;
    letter-spacing: 1px;
}
.end-card p {
    font-size: 14px;
    color: #888;
    line-height: 1.6;
    max-width: 400px;
}
.end-card .end-btn {
    margin-top: 24px;
    background: #4ea8de;
    color: #0f0f13;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s;
}
.end-card .end-btn:hover { background: #7ec8e3; }

.status {
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
    font-size: 14px;
    text-align: center;
    padding: 20px;
    padding-top: 76px;
    box-sizing: border-box;
}
    </style>
</head>
<body>

    <div class="topbar">
        <h1>C0balt</h1>
        <a class="readme-btn" href="https://github.com/aiden12910-12910/C0balt#readme" target="_blank">README</a>
    </div>

    <div class="mute-hint" id="muteHint">Tap to unmute</div>

    <div class="feed" id="feed">
        <div class="status" id="status">Loading videos...</div>
    </div>

    <script>
        const HF_USER = "aiden12910";
        const HF_REPO = "tiktok-videos";
        const HF_API = `https://huggingface.co/api/models/${HF_USER}/${HF_REPO}`;

        let globalMuted = true;

        async function loadVideos() {
            const feed = document.getElementById("feed");
            const status = document.getElementById("status");

            try {
                const res = await fetch(HF_API);
                if (!res.ok) throw new Error("Failed to fetch repo info");
                const data = await res.json();

                const videos = (data.siblings || [])
                    .map(f => f.rfilename)
                    .filter(name => name.toLowerCase().endsWith(".mp4"));

                feed.innerHTML = "";

                if (videos.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "status";
                    empty.textContent = "No videos yet.";
                    feed.appendChild(empty);
                    return;
                }

                videos.forEach((name, index) => {
                    const slide = document.createElement("div");
                    slide.className = "video-slide";
                    slide.dataset.index = index;

                    const video = document.createElement("video");
                    video.src = `https://huggingface.co/${HF_USER}/${HF_REPO}/resolve/main/${encodeURIComponent(name)}`;
                    video.loop = true;
                    video.playsInline = true;
                    video.muted = true;
                    video.preload = "metadata";
                    video.setAttribute("webkit-playsinline", "");

                    const meta = document.createElement("div");
                    meta.className = "video-meta";
                    meta.textContent = name;

                    const actions = document.createElement("div");
                    actions.className = "side-actions";

                    const muteBtn = document.createElement("button");
                    muteBtn.className = "action-btn";
                    muteBtn.textContent = "🔇";
                    muteBtn.title = "Toggle mute";
                    muteBtn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        globalMuted = !globalMuted;
                        video.muted = globalMuted;
                        muteBtn.textContent = globalMuted ? "🔇" : "🔊";
                        showMuteHint(globalMuted ? "Muted" : "Unmuted");
                    });

                    actions.appendChild(muteBtn);

                    slide.appendChild(video);
                    slide.appendChild(meta);
                    slide.appendChild(actions);
                    feed.appendChild(slide);

                    video.addEventListener("click", () => {
                        globalMuted = !globalMuted;
                        video.muted = globalMuted;
                        muteBtn.textContent = globalMuted ? "🔇" : "🔊";
                        showMuteHint(globalMuted ? "Muted" : "Unmuted");
                    });
                });

                // 到底提示卡片
                const endCard = document.createElement("div");
                endCard.className = "end-card";
                endCard.innerHTML = `
                    <h2>You're all caught up</h2>
                    <p>No more videos in this feed. Check back later or view the source on GitHub.</p>
                    <a class="end-btn" href="https://github.com/aiden12910-12910/C0balt#readme" target="_blank">View README</a>
                `;
                feed.appendChild(endCard);

                setupIntersectionObserver();

            } catch (e) {
                status.textContent = "Error loading videos: " + e.message;
            }
        }

        function setupIntersectionObserver() {
            const videos = document.querySelectorAll(".video-slide video");

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (entry.isIntersecting) {
                        videos.forEach(v => {
                            if (v !== video) {
                                v.pause();
                                v.currentTime = 0;
                            }
                        });
                        video.muted = globalMuted;
                        video.play().catch(() => {});
                        const btn = video.parentElement.querySelector(".action-btn");
                        if (btn) btn.textContent = globalMuted ? "🔇" : "🔊";
                    } else {
                        video.pause();
                    }
                });
            }, {
                threshold: 0.6
            });

            videos.forEach(v => observer.observe(v));
        }

        let hintTimer = null;
        function showMuteHint(text) {
            const hint = document.getElementById("muteHint");
            hint.textContent = text;
            hint.classList.add("show");
            if (hintTimer) clearTimeout(hintTimer);
            hintTimer = setTimeout(() => {
                hint.classList.remove("show");
            }, 1200);
        }

        loadVideos();
    </script>
</body>
</html>
