<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>C0balt · For You</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .topbar {
            position: fixed; top: 0; left: 0; right: 0; height: 56px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; z-index: 100;
            background: #0f0f13; border-bottom: 1px solid #2a2a35;
        }
        .topbar h1 { font-size: 20px; letter-spacing: 3px; color: #4ea8de; font-weight: 700; }
        .readme-btn {
            background: #4ea8de; color: #0f0f13; border: none;
            padding: 8px 14px; border-radius: 6px; font-size: 13px;
            font-weight: 600; cursor: pointer; text-decoration: none;
        }

        .feed {
            height: 100dvh; overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .feed::-webkit-scrollbar { display: none; }

        .video-slide {
            height: 100dvh; scroll-snap-align: start;
            position: relative; background: #000;
            padding-top: 56px; box-sizing: border-box;
        }
        .video-slide video {
            width: 100%; height: calc(100dvh - 56px);
            object-fit: contain; background: #000; display: block; cursor: pointer;
        }
        @media (orientation: portrait) {
            .video-slide video { object-fit: cover; }
        }

        .video-meta {
            position: absolute; bottom: 20px; left: 16px; right: 80px;
            z-index: 10; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            font-size: 13px; color: #fff; word-break: break-all; pointer-events: none;
        }

        .side-actions {
            position: absolute; right: 12px; bottom: 80px;
            display: flex; flex-direction: column; gap: 20px;
            align-items: center; z-index: 10;
        }
        .action-btn {
            background: rgba(255,255,255,0.15); border: none; color: #fff;
            width: 46px; height: 46px; border-radius: 50%; font-size: 20px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .mute-hint {
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 6px 14px; border-radius: 20px;
            font-size: 12px; color: #fff; z-index: 50; opacity: 0;
            transition: opacity 0.4s; pointer-events: none;
        }
        .mute-hint.show { opacity: 1; }

        /* 加载动画（预留：你以后替换成自己的） */
        #loading-spinner {
            display: none;
            height: 100dvh; scroll-snap-align: start;
            display: none;
            align-items: center; justify-content: center;
            flex-direction: column; gap: 16px;
            color: #888; font-size: 14px;
            background: #0f0f13;
        }
        #loading-spinner.show {
            display: flex;
        }
        #loading-spinner .spinner {
            width: 36px; height: 36px;
            border: 3px solid #2a2a35;
            border-top-color: #4ea8de;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .end-card {
            height: 100dvh; scroll-snap-align: start;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 40px; padding-top: 96px;
            background: #0f0f13; box-sizing: border-box;
        }
        .end-card h2 { font-size: 24px; color: #4ea8de; margin-bottom: 12px; }
        .end-card p { font-size: 14px; color: #888; line-height: 1.6; max-width: 400px; }

        .status {
            height: 100dvh; display: flex; align-items: center; justify-content: center;
            color: #888; font-size: 14px; text-align: center;
            padding: 20px; padding-top: 76px; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="topbar">
        <h1>C0balt</h1>
        <a class="readme-btn" href="https://github.com/aiden12910-12910/C0balt#readme" target="_blank">README</a>
    </div>

    <div class="mute-hint" id="muteHint">Tap to unmute</div>

    <div class="feed" id="feed">
        <div class="status" id="status">Loading videos...</div>
    </div>

    <script>
        // ===== 配置 =====
        const PAGE_SIZE = 20;          // 每页 20 个，预留网络损耗，可改小
        const PREFETCH_THRESHOLD = 10; // 剩 10 条时预取下一页

        // ===== 状态 =====
        let globalMuted = true;
        let currentPage = 0;
        let hasMore = true;
        let loading = false;
        let totalLoaded = 0;
        let observer = null;
        const slideNodes = []; // 记录已渲染的 slide，用于触底判断

        const feed = document.getElementById('feed');
        const status = document.getElementById('status');
        const spinner = document.getElementById('loading-spinner');

        // ===== 加载动画控制（你可以以后替换成自己的）=====
        function showLoading() {
            if (!spinner) return;
            spinner.classList.add('show');
            console.log('[load] spinner ON');
        }
        function hideLoading() {
            if (!spinner) return;
            spinner.classList.remove('show');
            console.log('[load] spinner OFF');
        }

        // ===== 请求一页视频 =====
        async function fetchPage(page) {
            const url = `/api/fetch-videos?action=list&page=${page}&size=${PAGE_SIZE}`;
            console.log('[load] fetching page', page, url);
            const res = await fetch(url);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            console.log('[load] page', page, 'returned', data.videos.length, 'hasMore', data.hasMore, 'total', data.total);
            return data;
        }

        // ===== 渲染一个视频 slide =====
        function renderSlide(video) {
            const slide = document.createElement('div');
            slide.className = 'video-slide';
            slide.dataset.name = video.name;

            const vid = document.createElement('video');
            vid.src = video.url;
            vid.loop = true;
            vid.playsInline = true;
            vid.muted = true;
            vid.preload = 'metadata';
            vid.setAttribute('webkit-playsinline', '');

            const meta = document.createElement('div');
            meta.className = 'video-meta';
            meta.textContent = video.name;

            const actions = document.createElement('div');
            actions.className = 'side-actions';

            const muteBtn = document.createElement('button');
            muteBtn.className = 'action-btn';
            muteBtn.textContent = globalMuted ? '🔇' : '🔊';
            muteBtn.title = 'Toggle mute';
            muteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                globalMuted = !globalMuted;
                vid.muted = globalMuted;
                muteBtn.textContent = globalMuted ? '🔇' : '🔊';
                showMuteHint(globalMuted ? 'Muted' : 'Unmuted');
            });

            actions.appendChild(muteBtn);
            slide.appendChild(vid);
            slide.appendChild(meta);
            slide.appendChild(actions);

            vid.addEventListener('click', () => {
                if (vid.paused) vid.play().catch(() => {});
                else vid.pause();
            });

            return slide;
        }

        // ===== 加载下一页并追加 =====
        async function loadNextPage() {
            if (loading || !hasMore) return;
            loading = true;
            showLoading();

            try {
                const data = await fetchPage(currentPage);

                if (data.videos.length === 0) {
                    hasMore = false;
                    console.log('[load] no more videos');
                    hideLoading();
                    return;
                }

                // 把 loading 动画从 DOM 里暂时移除（如果它在 feed 末尾）
                if (spinner && spinner.parentNode) spinner.parentNode.removeChild(spinner);

                data.videos.forEach(v => {
                    const slide = renderSlide(v);
                    feed.appendChild(slide);
                    slideNodes.push(slide);
                    observer.observe(slide);
                });

                totalLoaded += data.videos.length;
                currentPage += 1;
                hasMore = data.hasMore;

                // 如果还有更多，把 loading 动画重新放回末尾
                if (hasMore) {
                    feed.appendChild(spinner);
                } else {
                    // 没有更多了，加 end-card
                    const end = document.createElement('div');
                    end.className = 'end-card';
                    end.innerHTML = `
                        <h2>You're all caught up</h2>
                        <p>No more videos in this feed. Check back later or view the source on GitHub.</p>
                    `;
                    feed.appendChild(end);
                    console.log('[load] end card added');
                }

                console.log('[load] total loaded:', totalLoaded, 'hasMore:', hasMore);
                hideLoading();
            } catch (e) {
                console.error('[load] failed:', e);
                hideLoading();
            } finally {
                loading = false;
            }
        }

        // ===== IntersectionObserver：自动播放 + 触底预取 =====
        function setupObserver() {
            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const slide = entry.target;
                    const vid = slide.querySelector('video');
                    if (!vid) return;

                    if (entry.isIntersecting) {
                        // 暂停其他所有
                        document.querySelectorAll('.video-slide video').forEach(v => {
                            if (v !== vid) { v.pause(); v.currentTime = 0; }
                        });
                        vid.muted = globalMuted;
                        vid.play().catch(() => {});

                        // 触底预取：当前 slide 的索引 >= 总数 - 阈值
                        const idx = slideNodes.indexOf(slide);
                        const remain = slideNodes.length - idx;
                        console.log('[scroll] idx=', idx, 'remain=', remain, 'hasMore=', hasMore, 'loading=', loading);
                        if (hasMore && !loading && remain <= PREFETCH_THRESHOLD) {
                            console.log('[prefetch] triggered, remain=', remain);
                            loadNextPage();
                        }
                    } else {
                        vid.pause();
                    }
                });
            }, { threshold: 0.6 });
        }

        // ===== 提示 =====
        let hintTimer = null;
        function showMuteHint(text) {
            const hint = document.getElementById('muteHint');
            hint.textContent = text;
            hint.classList.add('show');
            if (hintTimer) clearTimeout(hintTimer);
            hintTimer = setTimeout(() => hint.classList.remove('show'), 1200);
        }

        // ===== 方向键跳 10 秒 =====
        document.addEventListener('keydown', (e) => {
            const videos = document.querySelectorAll('.video-slide video');
            let current = null, maxVisible = 0;
            videos.forEach(v => {
                const rect = v.getBoundingClientRect();
                const visible = Math.min(rect.bottom, window.innerHeight) - Math.max(rect.top, 0);
                if (visible > maxVisible) { maxVisible = visible; current = v; }
            });
            if (!current) return;
            if (e.key === 'ArrowRight') {
                current.currentTime = Math.min(current.currentTime + 10, current.duration || Infinity);
                e.preventDefault();
            } else if (e.key === 'ArrowLeft') {
                current.currentTime = Math.max(current.currentTime - 10, 0);
                e.preventDefault();
            }
        });

        // ===== 初始化 =====
        async function init() {
            // 清空 loading status
            feed.innerHTML = '';

            // 创建 spinner 节点（预留，你以后换自己的动画）
            const sp = document.createElement('div');
            sp.id = 'loading-spinner';
            sp.innerHTML = '<div class="spinner"></div><div>Loading...</div>';
            feed.appendChild(sp);
            // 替换全局引用
            window._spinner = sp;

            setupObserver();
            await loadNextPage();
        }

        init();
    </script>
</body>
</html>
