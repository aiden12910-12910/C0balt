<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>C0balt</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%; background: #000; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        .topbar {
            position: fixed; top: 0; left: 0; right: 0; height: 56px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; z-index: 100; background: #0f0f13; border-bottom: 1px solid #2a2a35;
            gap: 12px;
        }
        .topbar h1 { font-size: 20px; letter-spacing: 3px; color: #4ea8de; font-weight: 700; white-space: nowrap; }
        .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .topbar-left h1 { flex-shrink: 0; }
        #repo-select {
            background: #1e1e24; color: #fff; border: 1px solid #2a2a35;
            border-radius: 6px; padding: 6px 10px; font-size: 13px;
            max-width: 220px; cursor: pointer;
        }
        #repo-select:focus { outline: none; border-color: #4ea8de; }
        .readme-btn {
            background: #4ea8de; color: #0f0f13; border: none; padding: 8px 14px;
            border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none;
            white-space: nowrap; flex-shrink: 0;
        }
        .feed {
            height: 100dvh; overflow-y: scroll; scroll-snap-type: y mandatory;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .feed::-webkit-scrollbar { display: none; }
        .video-slide {
            height: 100dvh; scroll-snap-align: start; position: relative;
            background: #000; padding-top: 56px; box-sizing: border-box;
        }
        .video-slide video {
            width: 100%; height: calc(100dvh - 56px);
            object-fit: contain; background: #000; display: block; cursor: pointer;
        }
        @media (orientation: portrait) { .video-slide video { object-fit: cover; } }
        .video-meta {
            position: absolute; bottom: 20px; left: 16px; right: 80px; z-index: 10;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8); font-size: 13px; color: #fff;
            word-break: break-all; pointer-events: none;
        }
        .side-actions {
            position: absolute; right: 12px; bottom: 80px; display: flex;
            flex-direction: column; gap: 20px; align-items: center; z-index: 10;
        }
        .action-btn {
            background: rgba(255,255,255,0.15); border: none; color: #fff;
            width: 46px; height: 46px; border-radius: 50%; font-size: 20px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .mute-hint {
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 6px 14px; border-radius: 20px;
            font-size: 12px; color: #fff; z-index: 50; opacity: 0;
            transition: opacity 0.4s; pointer-events: none;
        }
        .mute-hint.show { opacity: 1; }

        .play-state-icon {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 84px; height: 84px; border-radius: 50%;
            background: rgba(0,0,0,0.55); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 36px; z-index: 30; opacity: 0;
            pointer-events: none; transition: opacity 0.25s, transform 0.25s;
        }
        .play-state-icon.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .play-state-icon.small { width: 64px; height: 64px; font-size: 28px; }

        #loading-spinner {
            display: none; height: 100dvh; scroll-snap-align: start;
            align-items: center; justify-content: center; flex-direction: column; gap: 16px;
            color: #888; font-size: 14px; background: #0f0f13;
        }
        #loading-spinner.show { display: flex; }
        #loading-spinner .spinner {
            width: 36px; height: 36px; border: 3px solid #2a2a35;
            border-top-color: #4ea8de; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .end-card {
            height: 100dvh; scroll-snap-align: start; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 40px; padding-top: 96px;
            background: #0f0f13; box-sizing: border-box;
        }
        .end-card h2 { font-size: 24px; color: #4ea8de; margin-bottom: 12px; }
        .end-card p { font-size: 14px; color: #888; line-height: 1.6; max-width: 400px; }
        .video-error {
            position: absolute; inset: 56px 0 0 0; display: flex;
            flex-direction: column; align-items: center; justify-content: center; gap: 10px;
            text-align: center; padding: 24px; background: rgba(15,15,19,0.92);
            z-index: 20; color: #f87171; font-size: 14px; box-sizing: border-box;
        }
        .video-error .err-title { font-size: 16px; font-weight: 600; color: #f87171; }
        .video-error .err-name { color: #a1a1aa; word-break: break-all; font-size: 12px; }
        .video-error .err-code { color: #71717a; font-size: 12px; }
        .video-error button {
            margin-top: 8px; background: #4ea8de; color: #0f0f13; border: none;
            padding: 8px 16px; border-radius: 6px; font-size: 13px;
            font-weight: 600; cursor: pointer;
        }
        .feed-error {
            height: 100dvh; scroll-snap-align: start; display: flex;
            flex-direction: column; align-items: center; justify-content: center; gap: 12px;
            text-align: center; padding: 40px; padding-top: 96px;
            background: #0f0f13; box-sizing: border-box; color: #f87171; font-size: 14px;
        }
        .feed-error button {
            background: #4ea8de; color: #0f0f13; border: none; padding: 8px 18px;
            border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="topbar-left">
            <h1>C0balt</h1>
            <select id="repo-select" title="Video source">
                <option value="tiktok-videos" selected>tiktok-videos</option>
                <option value="tiktok-videos-1">tiktok-videos-1</option>
                <option value="tiktok-videos-2">tiktok-videos-2</option>
                <option value="tiktok-videos-3">tiktok-videos-3</option>
                <option value="tiktok-videos-4">tiktok-videos-4</option>
                <option value="all">全部 / All</option>
            </select>
        </div>
        <a class="readme-btn" href="https://github.com/aiden12910-12910/C0balt#readme" target="_blank">README</a>
    </div>

    <div class="mute-hint" id="muteHint">Tap to unmute</div>

    <div class="feed" id="feed">
        <div class="status" id="status">Loading videos...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script>
        const PAGE_SIZE = 20;
        const PREFETCH_THRESHOLD = 10;
        const MAX_VIDEO_RETRIES = 3;
        const RETRY_DELAY_MS = 500;
        const HLS_ERROR_RETRY_MAX = 3;

        let globalMuted = true;
        let currentPage = 0;
        let hasMore = true;
        let loading = false;
        let totalLoaded = 0;
        let observer = null;
        let spinner = null;
        let totalAvailable = null;
        let currentRepo = 'tiktok-videos';
        const slideNodes = [];

        const feed = document.getElementById('feed');
        const repoSelect = document.getElementById('repo-select');

        function showLoading() { if (spinner) { spinner.classList.add('show'); console.log('[load] spinner ON'); } }
        function hideLoading() { if (spinner) { spinner.classList.remove('show'); console.log('[load] spinner OFF'); } }

        async function fetchPage(page) {
            const url = `/api/fetch-videos?action=list&page=${page}&size=${PAGE_SIZE}&repo=${encodeURIComponent(currentRepo)}`;
            console.log('[load] fetching page', page, url);
            const res = await fetch(url, { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            console.log('[load] page', page, 'repo', currentRepo, 'returned', data.videos.length, 'hasMore', data.hasMore, 'total', data.total);
            return data;
        }

        function videoErrorText(err) {
            if (!err) return '未知错误';
            const code = err.code;
            if (code === 1) return '加载被中止 (MEDIA_ERR_ABORTED)';
            if (code === 2) return '网络错误 (MEDIA_ERR_NETWORK)';
            if (code === 3) return '解码失败 (MEDIA_ERR_DECODE)';
            if (code === 4) return '格式不支持或文件不完整 (MEDIA_ERR_SRC_NOT_SUPPORTED)';
            return '错误码 ' + code;
        }

        function showVideoError(slide, video, err, retried) {
            if (slide.querySelector('.video-error')) return;
            const box = document.createElement('div');
            box.className = 'video-error';
            box.innerHTML = `
                <div class="err-title">${retried ? '视频重试后仍失败' : '视频加载失败'}</div>
                <div class="err-name"></div>
                <div class="err-code"></div>
            `;
            box.querySelector('.err-name').textContent = video.name;
            box.querySelector('.err-code').textContent = videoErrorText(err);
            const btn = document.createElement('button');
            btn.textContent = '重试';
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                box.remove();
                const vid = slide.querySelector('video');
                if (vid) {
                    slide._retryCount = 0;
                    slide._hlsRetry = 0;
                    initHls(slide, vid, video);
                    vid.play().catch(() => {});
                }
            });
            box.appendChild(btn);
            slide.appendChild(box);
            console.warn('[video] error on', video.name, err);
        }

        function initHls(slide, vid, video) {
            if (slide._hls) {
                try { slide._hls.destroy(); } catch (e) {}
                slide._hls = null;
            }
            slide._hlsRetry = 0;
            if (window.Hls && Hls.isSupported()) {
                const hls = new Hls({
                    maxBufferLength: 6,
                    maxMaxBufferLength: 12,
                    startLevel: -1,
                    capLevelToPlayerSize: true,
                    lowLatencyMode: false,
                });
                hls.loadSource(video.url);
                hls.attachMedia(vid);
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (!data.fatal) return;
                    if (slide._hlsRetry >= HLS_ERROR_RETRY_MAX) {
                        showVideoError(slide, video, { code: 4 }, true);
                        return;
                    }
                    slide._hlsRetry++;
                    console.warn('[hls] retry', slide._hlsRetry, '/', HLS_ERROR_RETRY_MAX, 'for', video.name, data.type);
                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                        hls.startLoad();
                    } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                        hls.recoverMediaError();
                    } else {
                        showVideoError(slide, video, { code: 4 }, true);
                    }
                });
                slide._hls = hls;
            } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
                vid.src = video.url;
            } else {
                showVideoError(slide, video, { code: 4 }, false);
            }
        }

        function showPlayStateIcon(slide, icon, small) {
            let iconEl = slide.querySelector('.play-state-icon');
            if (!iconEl) {
                iconEl = document.createElement('div');
                iconEl.className = 'play-state-icon';
                slide.appendChild(iconEl);
            }
            iconEl.textContent = icon;
            iconEl.classList.toggle('small', !!small);
            iconEl.classList.add('show');
            clearTimeout(iconEl._timer);
            iconEl._timer = setTimeout(() => iconEl.classList.remove('show'), 600);
        }

        function renderSlide(video) {
            const slide = document.createElement('div');
            slide.className = 'video-slide';
            slide.dataset.name = video.name;
            slide._retryCount = 0;
            slide._hlsRetry = 0;

            const vid = document.createElement('video');
            vid.loop = true;
            vid.playsInline = true;
            vid.muted = true;
            vid.preload = 'metadata';
            vid.setAttribute('webkit-playsinline', '');

            vid.addEventListener('error', () => {
                if (slide._hls) return;
                const err = vid.error;
                const code = err ? err.code : 0;
                const retriable = (code === 2 || code === 3 || code === 4);
                if (retriable && slide._retryCount < MAX_VIDEO_RETRIES) {
                    slide._retryCount++;
                    console.warn('[video] retry', slide._retryCount, '/', MAX_VIDEO_RETRIES, 'for', video.name);
                    setTimeout(() => {
                        initHls(slide, vid, video);
                        vid.play().catch(() => {});
                    }, RETRY_DELAY_MS);
                    return;
                }
                showVideoError(slide, video, err, slide._retryCount > 0);
            });

            vid.addEventListener('playing', () => {
                const box = slide.querySelector('.video-error');
                if (box) box.remove();
                showPlayStateIcon(slide, '▶', true);
            });

            vid.addEventListener('pause', () => {
                if (vid.readyState === 0) return;
                const rect = slide.getBoundingClientRect();
                const inView = rect.bottom > 0 && rect.top < window.innerHeight;
                if (inView) showPlayStateIcon(slide, '⏸', false);
            });

            const meta = document.createElement('div');
            meta.className = 'video-meta';
            const parts = video.name.split('/');
            meta.textContent = parts.length >= 2 ? parts[parts.length - 2] : video.name;

            const actions = document.createElement('div');
            actions.className = 'side-actions';
            const muteBtn = document.createElement('button');
            muteBtn.className = 'action-btn';
            muteBtn.textContent = globalMuted ? '🔇' : '🔊';
            muteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                globalMuted = !globalMuted;
                vid.muted = globalMuted;
                muteBtn.textContent = globalMuted ? '🔇' : '🔊';
                showMuteHint(globalMuted ? 'Muted' : 'Unmuted');
            });
            actions.appendChild(muteBtn);

            slide.appendChild(vid);
            slide.appendChild(meta);
            slide.appendChild(actions);

            vid.addEventListener('click', () => {
                if (vid.paused) vid.play().catch(() => {});
                else vid.pause();
            });

            initHls(slide, vid, video);
            return slide;
        }

        function showEmptyCard() {
            const end = document.createElement('div');
            end.className = 'end-card';
            end.innerHTML = `<h2>暂无视频</h2><p>当前视频源（${currentRepo}）里还没有可播放的 HLS。上传后刷新页面即可。</p>`;
            feed.appendChild(end);
        }

        function showFeedError(message, retryFn) {
            const box = document.createElement('div');
            box.className = 'feed-error';
            const t = document.createElement('div');
            t.textContent = '加载视频列表失败';
            const m = document.createElement('div');
            m.textContent = message || '';
            const btn = document.createElement('button');
            btn.textContent = '重试';
            btn.addEventListener('click', () => { box.remove(); retryFn(); });
            box.appendChild(t); box.appendChild(m); box.appendChild(btn);
            feed.appendChild(box);
        }

        async function loadNextPage() {
            if (loading || !hasMore) return;
            loading = true;
            showLoading();

            try {
                const data = await fetchPage(currentPage);
                if (totalAvailable === null && typeof data.total === 'number') totalAvailable = data.total;

                if (data.videos.length === 0) {
                    hasMore = false;
                    if (spinner && spinner.parentNode) spinner.parentNode.removeChild(spinner);
                    if (totalAvailable === 0 || totalLoaded === 0) {
                        showEmptyCard();
                    } else {
                        const end = document.createElement('div');
                        end.className = 'end-card';
                        end.innerHTML = `<h2>You're all caught up</h2><p>No more videos in this feed.</p>`;
                        feed.appendChild(end);
                    }
                    hideLoading();
                    return;
                }

                if (spinner && spinner.parentNode) spinner.parentNode.removeChild(spinner);

                const pageVideos = data.videos.slice();
                for (let i = pageVideos.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pageVideos[i], pageVideos[j]] = [pageVideos[j], pageVideos[i]];
                }
                console.log('[load] page', currentPage, 'shuffled:', pageVideos.map(v => v.name).join(', '));

                pageVideos.forEach(v => {
                    const slide = renderSlide(v);
                    feed.appendChild(slide);
                    slideNodes.push(slide);
                    observer.observe(slide);
                });

                totalLoaded += data.videos.length;
                currentPage += 1;
                hasMore = data.hasMore;

                if (hasMore) {
                    if (spinner) feed.appendChild(spinner);
                } else {
                    const end = document.createElement('div');
                    end.className = 'end-card';
                    end.innerHTML = `<h2>You're all caught up</h2><p>No more videos in this feed.</p>`;
                    feed.appendChild(end);
                }
                hideLoading();
            } catch (e) {
                console.error('[load] failed:', e);
                hideLoading();
                if (spinner && spinner.parentNode) spinner.parentNode.removeChild(spinner);
                if (totalLoaded === 0) {
                    showFeedError(e.message || String(e), () => {
                        hasMore = true; loading = false; loadNextPage();
                    });
                } else if (spinner && spinner.parentNode !== feed) {
                    feed.appendChild(spinner);
                }
            } finally {
                loading = false;
            }
        }

        function setupObserver() {
            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const slide = entry.target;
                    const vid = slide.querySelector('video');
                    if (!vid) return;
                    if (entry.isIntersecting) {
                        document.querySelectorAll('.video-slide video').forEach(v => {
                            if (v !== vid) { v.pause(); }
                        });
                        vid.muted = globalMuted;
                        vid.play().catch(() => {});
                        const idx = slideNodes.indexOf(slide);
                        const remain = slideNodes.length - idx;
                        if (hasMore && !loading && remain <= PREFETCH_THRESHOLD) {
                            loadNextPage();
                        }
                    } else {
                        vid.pause();
                    }
                });
            }, { threshold: 0.6 });
        }

        let hintTimer = null;
        function showMuteHint(text) {
            const hint = document.getElementById('muteHint');
            hint.textContent = text;
            hint.classList.add('show');
            if (hintTimer) clearTimeout(hintTimer);
            hintTimer = setTimeout(() => hint.classList.remove('show'), 1200);
        }

        document.addEventListener('keydown', (e) => {
            const videos = document.querySelectorAll('.video-slide video');
            let current = null, maxVisible = 0;
            let currentSlide = null;
            videos.forEach(v => {
                const rect = v.getBoundingClientRect();
                const visible = Math.min(rect.bottom, window.innerHeight) - Math.max(rect.top, 0);
                if (visible > maxVisible) { maxVisible = visible; current = v; currentSlide = v.closest('.video-slide'); }
            });
            if (!current) return;
            if (e.key === 'ArrowRight') {
                current.currentTime = Math.min(current.currentTime + 10, current.duration || Infinity);
                if (currentSlide) showPlayStateIcon(currentSlide, '⏩', true);
                e.preventDefault();
            } else if (e.key === 'ArrowLeft') {
                current.currentTime = Math.max(current.currentTime - 10, 0);
                if (currentSlide) showPlayStateIcon(currentSlide, '⏪', true);
                e.preventDefault();
            } else if (e.key === ' ') {
                if (current.paused) current.play().catch(() => {});
                else current.pause();
                e.preventDefault();
            }
        });

        function resetFeedForRepo(repo) {
            currentRepo = repo;
            currentPage = 0;
            hasMore = true;
            loading = false;
            totalLoaded = 0;
            totalAvailable = null;
            slideNodes.length = 0;
            if (observer) {
                observer.disconnect();
                observer = null;
            }
            feed.innerHTML = '';
            const sp = document.createElement('div');
            sp.id = 'loading-spinner';
            sp.innerHTML = '<div class="spinner"></div><div>Loading...</div>';
            feed.appendChild(sp);
            spinner = sp;
            setupObserver();
            loadNextPage();
        }

        repoSelect.addEventListener('change', (e) => {
            console.log('[repo] switched to', e.target.value);
            resetFeedForRepo(e.target.value);
        });

        async function init() {
            resetFeedForRepo(currentRepo);
        }

        init();
    </script>
</body>
</html>
